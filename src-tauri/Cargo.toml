[package]
name = "arbora"
version = "0.1.0"
description = "Local-first study space — Tauri core."
authors = ["Arbora contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it won't conflict with the bin
# name on Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "arbora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite via sqlx, run on Tauri's tokio runtime. Embedded migrations.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
# Loopback HTTP to the Python sidecar (blocking client used from a lifecycle thread).
reqwest = { version = "0.12", features = ["blocking", "json"] }