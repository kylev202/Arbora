[package]
name = "arbora"
version = "0.2.0"
description = "Local-first study space — Tauri core."
authors = ["Arbora contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it won't conflict with the bin
# name on Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "arbora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# Native file-open dialog for "Add source".
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite via sqlx, run on Tauri's tokio runtime. Embedded migrations.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
# Loopback HTTP to the Python sidecar (blocking client used from a lifecycle thread).
reqwest = { version = "0.12", features = ["blocking", "json"] }
# UUIDv4 primary keys for rows the core creates.
uuid = { version = "1", features = ["v4"] }
# `tokio::time::sleep` for the ingest/generation status pollers (runs on Tauri's runtime).
tokio = { version = "1", features = ["time"] }
# Device RAM detection for the onboarding preset recommendation.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
# Drives async command tests (`#[tokio::test]`) against an in-memory SQLite.
tokio = { version = "1", features = ["macros", "rt"] }
