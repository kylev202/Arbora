name: Deploy website

# Publish the static landing page in website/ to GitHub Pages.
# Enable once in the repo: Settings → Pages → Source: "GitHub Actions".
# Runs on pushes that touch website/ (on the default branch) or manually.

on:
  push:
    branches: [main, feat/phase4-backend-wiring]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let the newest win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
