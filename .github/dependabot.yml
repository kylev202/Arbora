# Weekly dependency-update PRs for all three layers + the workflows themselves.
# Pairs with the CI `audit` job: dependabot proposes the fix, the audit gates
# regressions in between.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sidecar
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
